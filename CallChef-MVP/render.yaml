services:
  - type: web
    name: callchef
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: callchef-db
          property: connectionString
      - key: STREAM_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-realtime-whisper
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
databases:
  - name: callchef-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: callchef
    user: callchef
